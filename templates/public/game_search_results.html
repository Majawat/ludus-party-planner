{% if results %}
  <div class="space-y-1 mt-2">
    {% for result in results %}
      <div class="flex items-center gap-3 p-2 bg-base-300 rounded-lg">
        {% if result.image %}
          <img src="{{ result.image }}" alt="{{ result.name }}" class="h-12 w-auto rounded flex-shrink-0">
        {% else %}
          <div class="h-12 w-12 bg-base-200 rounded flex-shrink-0 flex items-center justify-center text-base-content/30 text-xs">?</div>
        {% endif %}
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm truncate">{{ result.name }}</div>
          {% if result.year %}
            <div class="text-xs text-base-content/50">{{ result.year }}</div>
          {% endif %}
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          {% if result.source == "bgg" %}
            <span class="badge badge-success badge-xs">BGG</span>
          {% else %}
            <span class="badge badge-info badge-xs">Steam</span>
          {% endif %}
          <button type="button"
            class="btn btn-xs btn-outline"
            onclick="selectGame(
              {{ result.name | tojson }},
              {{ result.id | tojson if result.source == 'bgg' else 'null' }},
              {{ result.id | tojson if result.source == 'steam' else 'null' }}
            )">Select</button>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p class="text-xs text-base-content/40 mt-2">No results found.</p>
{% endif %}
