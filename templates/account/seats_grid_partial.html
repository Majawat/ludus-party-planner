<div id="seat-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
  {% for seat in seats %}
    {% set is_mine = registration.seat_id == seat.id %}
    {% set is_taken = seat.id in taken_map and not is_mine %}
    <div class="card shadow border
      {% if is_mine %}border-primary bg-primary/10
      {% elif is_taken %}border-base-300 bg-base-200 opacity-60
      {% else %}border-base-300 bg-base-200 hover:border-primary{% endif %}">
      <div class="card-body p-3 text-center">
        <p class="font-semibold text-sm">{{ seat.label }}</p>
        {% if is_mine %}
          <p class="text-xs text-primary mb-2">Your seat</p>
          <form method="POST"
                action="{{ url_for('account.seat_release', slug=event.slug) }}"
                hx-post="{{ url_for('account.seat_release', slug=event.slug) }}"
                hx-target="#seat-grid"
                hx-swap="outerHTML">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button type="submit" class="btn btn-outline btn-xs btn-error">Release</button>
          </form>
        {% elif is_taken %}
          <p class="text-xs opacity-50">{{ taken_map[seat.id].user.public_name }}</p>
        {% else %}
          <form method="POST"
                action="{{ url_for('account.seat_claim', slug=event.slug) }}"
                hx-post="{{ url_for('account.seat_claim', slug=event.slug) }}"
                hx-target="#seat-grid"
                hx-swap="outerHTML">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <input type="hidden" name="seat_id" value="{{ seat.id }}" />
            <button type="submit" class="btn btn-primary btn-xs">Claim</button>
          </form>
        {% endif %}
      </div>
    </div>
  {% endfor %}
</div>
