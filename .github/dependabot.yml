# Dependabot version updates. Security updates (patches for known CVEs) are
# enabled separately in repo settings and are not configured here.
version: 2
updates:
  # Python dependencies (requirements.txt at repo root)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk minor/patch bumps into one PR to cut noise.
      # Major bumps still arrive as individual PRs for manual review.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows in this repo
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
